<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're subscribed | Attenstra</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap");

      :root {
        color-scheme: light;
        --background: #e0d5c7;
        --foreground: #3a3832;
        --muted: #6b7280;
        --border: rgba(58, 56, 50, 0.12);
        --surface: #ebe3d8;
        --button: #7d8293;
        --button-text: #ebe3d8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--background);
        color: var(--foreground);
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 42rem);
        text-align: center;
      }

      h1 {
        margin: 0 0 1rem;
        font-family: "Playfair Display", serif;
        font-size: clamp(2.4rem, 8vw, 4.8rem);
        line-height: 0.98;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0 auto;
        max-width: 34rem;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.5;
      }

      .panel {
        margin-top: 1.5rem;
        padding: 1.2rem 1.1rem;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: rgba(235, 227, 216, 0.55);
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 3rem;
        margin-top: 1.5rem;
        padding: 0.8rem 1.25rem;
        border-radius: 12px;
        background: var(--button);
        color: var(--button-text);
        text-decoration: none;
        font-weight: 600;
      }

      .fine {
        margin-top: 0.9rem;
        font-size: 0.88rem;
      }

      .brand-footer {
        margin-top: 2rem;
        text-align: center;
      }

      .brand-logo {
        width: min(100%, 14rem);
        margin: 0 auto;
        display: block;
        mix-blend-mode: multiply;
        filter: contrast(1.1);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re subscribed.</h1>
      <p>
        You are now in the loop for Attenstra updates.
      </p>
      <div class="panel">
        <p>
          We’ll share occasional updates on Attenstra and what we’re building.
        </p>
      </div>
      <a class="button" href="/">Back to Attenstra</a>
      <p class="fine">Thanks for following along.</p>
      <div class="brand-footer">
        <img
          src="/assets/Attenstra_Woirdmark_LightBlue_Stream_Transparent_Background.png"
          alt="Attenstra"
          class="brand-logo"
        />
      </div>
    </main>
  </body>
</html>
